<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajantik Cloud</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { max-width: 480px; padding: 2rem; background: #1e293b; border-radius: 16px; text-align: center; }
  h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
  p { color: #94a3b8; line-height: 1.6; margin: .4rem 0; }
  .ok { color: #4ade80; font-weight: bold; }
</style>
</head>
<body>
  <div class="card">
    <h1>☁️ Ajantik Cloud</h1>
    <p class="ok">Çalışıyor ✓</p>
    <p>Bu servis, Telegram botunun <strong>kısıtlı bulut modudur</strong>.
       Laptop kapalıyken bot yazılı sorulara buradan cevap verir.</p>
    <p>Webhook adresi: <code>/.netlify/functions/telegram</code></p>
  </div>
</body>
</html>
